[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seqstate"
dynamic = ["version"]
dependencies = [
    "gb_io~=0.4",
    "polars>=2.0,<3.0",
    "pyrodigal~=3.7",
    "pyhmmer~=0.12.0",
    "rich>=13.0",
    "rich-argparse>=1.5,<2.0",
]
requires-python = ">=3.10"
authors = [
  {name = "Raymund Hackett", email = "r.e.hackett@uni-konstanz.de"},
]
maintainers = [
  {name = "Raymund Hackett", email = "r.e.hackett@uni-konstanz.de"}
]
description = "Handle genomic seqeunces, call genes, annotate with HMMs and build genome databases!"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
keywords = ["bioinformatics", "genome"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

# Read the project version from seqstate/_version.py.
[tool.hatch.version]
path = "src/seqstate/_version.py"

[project.optional-dependencies]
compress = [
    "isal",
    "backports.zstd; python_version < '3.14'"
]

[project.urls]
Homepage = "https://example.com"
Documentation = "https://readthedocs.org"
Repository = "https://github.com/me/spam.git"
"Bug Tracker" = "https://github.com/me/spam/issues"
Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

[project.scripts]
seqstate-cli = "seqstate.cli.__main__:main"
